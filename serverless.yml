# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: make73
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: mandivyapari
# "service" is the name of this project. This will also be added to your AWS resource names.
service: mandiVyapari
useDotenv: true

provider:
  name: aws
  region: ap-southeast-1
  runtime: nodejs22.x
  environment:
    # app.js picks HMB vs HIS from this, not from which DB vars are set
    STAGE: ${sls:stage}
    # Per stage from .env.<stage>: HIS (dev/prod) uses DATABASE_URL (Neon); HMB uses SUBSCRIPTIONS_SUPABASE_URL/KEY (not SUPABASE_*, which may be set machine-wide)
    DATABASE_URL: ${env:DATABASE_URL, 'none'}
    SUBSCRIPTIONS_SUPABASE_URL: ${env:SUBSCRIPTIONS_SUPABASE_URL, 'none'}
    SUBSCRIPTIONS_SUPABASE_KEY: ${env:SUBSCRIPTIONS_SUPABASE_KEY, 'none'}
    ALLOWED_ORIGINS: ${env:ALLOWED_ORIGINS, 'none'}
    PUBLIC_KEY: BFcAYkpjplEVe5f4dBBRpNZTlk-Fp-mdtqdex0DZEGiEIFtNy8GaM1Fge4UmIlf0n2yvyKrr9mUM-K88Wih5Djs
    PRIVATE_KEY: pSenjSgRTQQQfqvE-bGno7QuioA7rpYcI-n9TJXwmFg
  # Uncomment to easily set up a custom domain. Read the docs for more details:
  # https://www.serverless.com/framework/docs/providers/aws/guide/domains
  # domain: api.example.com

functions:
  api:
    handler: src/app.app
    events:
      - http:
          path: /{proxy+}
          method: any
          cors: true
plugins:
  - serverless-offline

